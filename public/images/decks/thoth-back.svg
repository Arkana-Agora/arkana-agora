<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 525" width="315" height="525">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d051a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b87c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a838;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none"/>
      <path d="M15,0 L30,15 L15,30 L0,15 Z" fill="none" stroke="url(#copper)" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="315" height="525" fill="url(#bg)"/>
  <rect width="315" height="525" fill="url(#pattern)"/>
  
  <!-- Border -->
  <rect x="15" y="15" width="285" height="495" rx="15" fill="none" stroke="url(#copper)" stroke-width="3"/>
  <rect x="20" y="20" width="275" height="485" rx="12" fill="none" stroke="url(#copper)" stroke-width="1" opacity="0.5"/>
  
  <!-- Central symbol - Thoth's Ankh/Hierophant symbol -->
  <g transform="translate(157.5, 262.5)" filter="url(#glow)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#copper)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#copper)" stroke-width="1" opacity="0.5"/>
    
    <!-- Ankh symbol -->
    <g stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#glow)">
      <!-- Vertical line -->
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <!-- Horizontal bar -->
      <line x1="-30" y1="-15" x2="30" y2="-15"/>
      <!-- Top loop -->
      <path d="M-15,-35 A15,15 0 1,0 15,-35" fill="none"/>
    </g>
    
    <!-- Central circle -->
    <circle cx="0" cy="0" r="35" fill="url(#bg)" stroke="url(#copper)" stroke-width="2"/>
    
    <!-- Eye of Horus -->
    <g stroke="url(#copper)" stroke-width="2" fill="none">
      <!-- Eye outline -->
      <ellipse cx="0" cy="-5" rx="20" ry="12"/>
      <!-- Iris -->
      <circle cx="0" cy="-5" r="6" fill="url(#copper)" opacity="0.9"/>
      <!-- Pupil -->
      <circle cx="0" cy="-5" r="2" fill="#0d051a"/>
      <!-- Eyebrow -->
      <path d="M-20,-20 Q0,-30 20,-20" stroke="url(#copper)" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Hieroglyphic border marks -->
    <g stroke="url(#copper)" stroke-width="1" opacity="0.4" font-size="20" font-family="serif">
      <text x="-80" y="-90" text-anchor="middle">𓂀</text>
      <text x="80" y="-90" text-anchor="middle">𓂀</text>
      <text x="-80" y="105" text-anchor="middle">𓋹</text>
      <text x="80" y="105" text-anchor="middle">𓋹</text>
    </g>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="url(#copper)" stroke-width="1.5" opacity="0.5">
    <path d="M40,40 L40,60 M40,40 L60,40" fill="none"/>
    <path d="M275,40 L255,40 M275,40 L275,60" fill="none"/>
    <path d="M40,485 L40,465 M40,485 L60,485" fill="none"/>
    <path d="M275,485 L275,465 M275,485 L255,485" fill="none"/>
  </g>
  
  <!-- Bottom text -->
  <text x="157.5" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="url(#copper)" opacity="0.8" letter-spacing="2">
    THOTH TAROT
  </text>
</svg>