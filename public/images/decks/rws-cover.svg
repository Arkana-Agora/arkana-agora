<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 525" width="315" height="525">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a843;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M20,0 L40,20 L20,40 L0,20 Z" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="315" height="525" fill="url(#bg)"/>
  <rect width="315" height="525" fill="url(#pattern)"/>
  
  <!-- Border -->
  <rect x="15" y="15" width="285" height="495" rx="15" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="20" y="20" width="275" height="485" rx="12" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  
  <!-- Central symbol - The Fool (0) / Sun symbol -->
  <g transform="translate(157.5, 262.5)" filter="url(#glow)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    
    <!-- Inner sun rays -->
    <g stroke="url(#gold)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-80" x2="0" y2="-95"/>
      <line x1="0" y1="80" x2="0" y2="95"/>
      <line x1="-80" y1="0" x2="-95" y2="0"/>
      <line x1="80" y1="0" x2="95" y2="0"/>
      <line x1="-56.5" y1="-56.5" x2="-67" y2="-67"/>
      <line x1="56.5" y1="56.5" x2="67" y2="67"/>
      <line x1="-56.5" y1="56.5" x2="-67" y2="67"/>
      <line x1="56.5" y1="-56.5" x2="67" y2="-67"/>
    </g>
    
    <!-- Central circle with sun face -->
    <circle cx="0" cy="0" r="40" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Sun face details -->
    <circle cx="-10" cy="-5" r="4" fill="url(#gold)" opacity="0.9"/>
    <circle cx="10" cy="-5" r="4" fill="url(#gold)" opacity="0.9"/>
    <path d="M-15,10 Q0,18 15,10" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="url(#gold)" stroke-width="1.5" opacity="0.5">
    <path d="M40,40 L40,60 M40,40 L60,40" fill="none"/>
    <path d="M275,40 L255,40 M275,40 L275,60" fill="none"/>
    <path d="M40,485 L40,465 M40,485 L60,485" fill="none"/>
    <path d="M275,485 L275,465 L255,485" fill="none"/>
  </g>
  
  <!-- Bottom text -->
  <text x="157.5" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="url(#gold)" opacity="0.8" letter-spacing="2">
    RIDER-WAITE-SMITH
  </text>
</svg>