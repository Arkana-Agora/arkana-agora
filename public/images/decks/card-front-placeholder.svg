<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 525" width="315" height="525">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a843;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#e8c56d" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="315" height="525" fill="url(#bg)"/>
  <rect width="315" height="525" fill="url(#pattern)"/>
  
  <!-- Border -->
  <rect x="8" y="8" width="299" height="509" rx="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="14" y="14" width="287" height="497" rx="10" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  
  <!-- Central decorative area -->
  <g transform="translate(157.5, 262.5)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Decorative cross/star pattern -->
    <g stroke="url(#gold)" stroke-width="1.5" opacity="0.5" filter="url(#glow)">
      <line x1="0" y1="-70" x2="0" y2="-85"/>
      <line x1="0" y1="70" x2="0" y2="85"/>
      <line x1="-70" y1="0" x2="-85" y2="0"/>
      <line x1="70" y1="0" x2="85" y2="0"/>
      <line x1="-50" y1="-50" x2="-60" y2="-60"/>
      <line x1="50" y1="50" x2="60" y2="60"/>
      <line x1="-50" y1="50" x2="-60" y2="60"/>
      <line x1="50" y1="-50" x2="60" y2="-60"/>
    </g>
    
    <!-- Central circle with subtle design -->
    <circle cx="0" cy="0" r="50" fill="url(#bg)" stroke="url(#gold)" stroke-width="1.5"/>
    
    <!-- Central symbol - generic tarot symbol -->
    <g fill="url(#gold)" opacity="0.7">
      <!-- Simplified tarot symbol - circle with cross -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#gold)" stroke-width="1.5"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="url(#gold)" stroke-width="1.5" opacity="0.4">
    <path d="M25,25 L25,45 M25,25 L45,25" fill="none"/>
    <path d="M290,25 L270,25 M290,25 L290,45" fill="none"/>
    <path d="M25,500 L25,480 M25,500 L45,500" fill="none"/>
    <path d="M290,500 L290,480 L270,500" fill="none"/>
  </g>
  
  <!-- Bottom text -->
  <text x="157.5" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="url(#gold)" opacity="0.6" letter-spacing="1.5">ARCANA CARTA</text>
</svg>