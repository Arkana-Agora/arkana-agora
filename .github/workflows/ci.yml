name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run type-check

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: type-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: akasha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/akasha_test
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy --schema=./prisma/schema.prisma
      # Gate de drift (review data N12): migrations × schema × DB ao vivo.
      # `--exit-code` → exit 2 quando há drift (schema não refletido em
      # migration.sql, ou migration aplicada divergente do schema.prisma).
      - run: bunx prisma migrate status --schema=./prisma/schema.prisma
      - run: bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Gate cego do `migrate diff`: CHECKs e `NULLS NOT DISTINCT` não são
      # modelados pelo schema.prisma — um drop manual de constraint deixa o
      # diff verde. Assertion SQL cobre as constraints escritas à mão.
      - run: bunx prisma db execute --file prisma/ci/assert-integrity.sql
      - run: bun run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          if-no-files-found: error
          include-hidden-files: true

  # Gate: presença dos secrets VERCEL_* checada em step — os contextos
  # `secrets`/`env` NÃO estão disponíveis em `if:` de job-level.
  # Sem creds → has_creds=false → deploy skipado, workflow permanece verde.
  gate-deploy:
    name: Gate (secrets Vercel)
    runs-on: ubuntu-latest
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

  # Staging/preview a cada push na `main` (M0); prod via promoção manual no painel da Vercel.
  deploy-staging:
    name: Deploy Staging (Vercel preview)
    runs-on: ubuntu-latest
    needs: [build, gate-deploy]
    if: >-
      needs.gate-deploy.outputs.has_creds == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - env:
          # Use preview URL for staging deploys, not production URL
          AUTH_URL: https://${{ github.repository }}-${{ github.run_id }}.vercel.app
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_TRUST_HOST: true
        run: |
          echo "AUTH_URL set to preview deployment"
      - uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ github.token }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: true
          github-deployment: false
